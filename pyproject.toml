[project]
name = "tlaloc"
version = "0.1.5"
description = "A SaaS metric analysis library for rutine tasks"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.4.3",
    "pyspark>=4.0.1",
    "toolz>=1.1.0",
]

[build-system]
requires = ["hatchling>=1.19"]
build-backend = "hatchling.build"

[tool.hatch.build]
include = ["tlaloc/**"]

[tool.bumpversion]
current_version = "0.1.5"
commit = true
tag = true
tag_name = "v{new_version}"

[[tool.bumpversion.files]]
filename = "tlaloc/__init__.py"
search = '__version__ = "{current_version}"'
replace = '__version__ = "{new_version}"'

[[tool.bumpversion.files]]
filename = "pyproject.toml"
search = 'version = "{current_version}"'
replace = 'version = "{new_version}"'


[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "diff-cover>=9.0",
]

[tool.pytest.ini_options]
testpaths = ["test"]
addopts = "--strict-markers -q"

[tool.coverage.run]
source = ["src"]
branch = true                  # Track branch coverage, not just line coverage
omit = [
    "*/tests/*",
    "*/__init__.py",
    "*/conftest.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 80                # Global coverage threshold
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "pass",
]

[tool.diff_cover]
compare_branch = "origin/main"
fail_under = 80
include_untracked = false