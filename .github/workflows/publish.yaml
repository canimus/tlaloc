# .github/workflows/publish.yml
name: Publish to PyPI

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump type"
        required: true
        default: "patch"
        type: choice
        options:
          - patch
          - minor
          - major

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true   # ← opts into Node.js 24 now

jobs:
  bump-and-publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2        # ← latest patch with Node 24 support

      - name: Set up Python
        uses: actions/setup-python@v5.4.0    # ← latest patch with Node 24 support

      - name: Install build tools
        run: pip install hatch bump-my-version

      - name: Configure git
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Bump version
        run: bump-my-version bump ${{ github.event.inputs.bump }}

      - name: Get new version
        run: echo "NEW_VERSION=$(bump-my-version show current_version)" >> $GITHUB_ENV

      - name: Push version bump commit and tag
        run: git push origin main --follow-tags

      - name: Build wheel and sdist
        run: hatch build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1